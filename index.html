<!doctype html>
<html lang="en-NZ" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Indy's Year">
<meta name="theme-color" content="#0B0D10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Indy's Year</title>
<style>
/* Fonts: Chakra Petch (display/numbers) + Barlow (body), self-hosted in /fonts (custom subset: Latin, Latin Extended-A, arrows, approx sign) */
@font-face{font-family:"Barlow";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-400.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-500.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-600.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-700.woff2) format("woff2")}
@font-face{font-family:"Chakra Petch";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/chakra-petch-500.woff2) format("woff2")}
@font-face{font-family:"Chakra Petch";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/chakra-petch-600.woff2) format("woff2")}
@font-face{font-family:"Chakra Petch";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/chakra-petch-700.woff2) format("woff2")}
:root{
  --bg:#060708;--surface:#0F1316;--surface-2:#141A1D;--line:#1F272B;
  --text:#F2F4F7;--dim:#9AA3AF;
  --accent:#CBFF2E;--on-accent:#081005;
  --good:#34D399;--warn:#FBBF24;--bad:#F87171;--info:#5CC8FF;
  --glow:color-mix(in srgb,var(--accent) 38%,transparent);
  --display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;--glowon:1;
  --a70:color-mix(in srgb,var(--accent) 70%,var(--surface));
  --a40:color-mix(in srgb,var(--accent) 40%,var(--surface));
  --a15:color-mix(in srgb,var(--accent) 15%,var(--surface));
  --font:"Barlow","Chakra Petch",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  --r-lg:22px;--r-md:16px;--r-sm:12px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root{color-scheme:dark}
:root[data-mode="light"]{
  color-scheme:light;--glowon:0;--bg:#F4F5F7;--surface:#FFFFFF;--surface-2:#EDEFF3;--line:#DDE1E7;
  --text:#0B0D10;--dim:#4B5563;
  --good:#047857;--warn:#AD4F08;--bad:#B91C1C;--info:#0369A1;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.05;letter-spacing:-.01em;font-family:var(--display);font-weight:700}
h2{font-size:1.5rem;font-weight:800;margin:1.6rem 0 .7rem}
h3{font-size:1.02rem;font-weight:700;margin:0 0 .35rem}
p{margin:.3rem 0}
.dim{color:var(--dim)}
.num{font-variant-numeric:tabular-nums}
main{max-width:620px;margin:0 auto;padding:0 16px calc(150px + env(safe-area-inset-bottom,0px))}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin:10px 0;position:relative;overflow:hidden}
.card.hero{padding:20px 18px 14px;background:
  radial-gradient(130% 85% at 100% -10%,var(--a15),transparent 58%),var(--surface)}
.lbl{font-size:.78rem;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-family:var(--display)}
.big{font-family:var(--display);font-size:clamp(3rem,15vw,4.4rem);font-weight:700;letter-spacing:-.03em;line-height:.9;font-variant-numeric:tabular-nums;color:var(--accent);text-shadow:0 0 calc(34px * var(--glowon)) var(--glow)}
.big small{font-size:max(.26em,.8rem);font-weight:700;letter-spacing:.02em;color:var(--dim);margin-left:5px;text-shadow:none;font-family:var(--font)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.chip.acc{background:var(--accent);color:var(--on-accent)}
.chip.good{color:var(--good)}.chip.warn{color:var(--warn)}.chip.bad{color:var(--bad)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2>*,.grid3>*{min-width:0}
.tile{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.tile b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--accent);text-shadow:0 0 calc(14px * var(--glowon)) var(--glow)}
.tile span{font-size:.78rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-weight:600}

/* buttons */
.btn{border:0;border-radius:var(--r-md);padding:13px 18px;background:var(--accent);color:var(--on-accent);font-weight:800;min-height:50px;box-shadow:0 0 28px var(--glow);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.alt{background:var(--surface-2);color:var(--text);box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);box-shadow:none}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad);box-shadow:none}
.btn.block{width:100%}
.btn.xl{width:100%;min-height:62px;font-size:1.15rem}
.btn.sm{min-height:44px;padding:8px 13px;font-size:.88rem;border-radius:var(--r-sm)}
.btn:disabled{opacity:.4}
label{display:block;font-size:.84rem;color:var(--dim);margin:.6rem 0 .25rem;font-weight:600}
input,select,textarea{min-width:0;max-width:100%;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;min-height:48px}
textarea{min-height:90px}
input[type=color]{padding:4px;height:48px}
.seg{display:flex;background:var(--surface-2);border-radius:var(--r-md);padding:4px;gap:4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;min-width:44px;border:0;background:none;border-radius:11px;padding:9px 12px;font-weight:700;white-space:nowrap;min-height:44px;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text)}
:root[data-mode="light"] .seg button[aria-pressed="true"]{box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.76rem;font-weight:700;color:var(--dim);min-width:0;flex:1;min-height:52px;padding:2px 1px}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button[aria-current="page"] svg{filter:drop-shadow(0 0 6px var(--glow))}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:12px 2px 2px}
.top h1{font-size:1.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.01em}

/* rings */
.rings{display:flex;align-items:center;gap:16px}
.rings svg{width:104px;height:104px;flex:none}
.ringleg{display:flex;flex-direction:column;gap:9px;flex:1}
.ringleg div{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
.ringleg b{font-variant-numeric:tabular-nums;font-family:var(--display);color:var(--accent)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* figure */
.fig{display:block;width:100%;height:auto}
.figbox{background:radial-gradient(70% 70% at 50% 60%,var(--a15),transparent 70%);border-radius:var(--r-md)}
.thumb{width:64px;height:64px;flex:none;background:var(--surface-2);border-radius:14px}

/* lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .x{background:none;border:0;color:var(--dim);font-size:1.3rem;min-width:44px;min-height:44px}

/* plan grid */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.day{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font-weight:800;font-size:1rem;color:var(--text)}
.day small{font-size:.75rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--dim)}
.day.done{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.day.done small{color:var(--on-accent)}
.day.next{box-shadow:inset 0 0 0 2px var(--accent)}
.day.sel{outline:2px solid var(--text);outline-offset:1px}

/* workout */
.wk-top{display:flex;justify-content:space-between;align-items:center;padding-top:14px}
.exname{font-family:var(--display);font-size:1.8rem;font-weight:700;text-align:center;letter-spacing:-.02em;margin-top:6px}
.extarget{text-align:center;color:var(--dim);font-weight:600}
.timer{position:relative;width:230px;height:230px;margin:6px auto}
.timer svg{position:absolute;inset:0;width:100%;height:100%}
.timer .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:3.2rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:10px 0}
.stepper button{width:60px;height:60px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-size:1.7rem;font-weight:800}
.stepper output{font-size:3rem;font-weight:800;min-width:90px;text-align:center;font-variant-numeric:tabular-nums}
.queue{list-style:none;padding:0;margin:8px 0 0;font-size:.9rem}
.queue li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);color:var(--dim)}
.queue li.now{color:var(--accent);font-weight:800}
.queue li.done{text-decoration:line-through;opacity:.55}

/* walks */
.walks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.walks button{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-md);padding:4px;min-height:54px;font-weight:700;color:var(--text)}
.walks button.done{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.walks button small{display:block;font-weight:600;font-size:.82rem;opacity:.8}

/* insights */
.insight{padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2);margin:8px 0;border-left:4px solid var(--accent)}
.insight.warn{border-color:var(--warn)}
.insight.bad{border-color:var(--bad)}
.insight.good{border-color:var(--good)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--dim);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.band{position:relative;height:14px;border-radius:999px;background:linear-gradient(90deg,var(--good) 0 30%,var(--warn) 30% 45%,var(--bad) 45% 100%);margin:16px 0 22px}
.band .pin{position:absolute;top:-6px;width:4px;height:26px;border-radius:2px;background:var(--text);transform:translateX(-2px)}
.band .tick{position:absolute;top:18px;font-size:.78rem;color:var(--dim);transform:translateX(-50%)}

/* swatches */
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw{border:2px solid transparent;border-radius:var(--r-md);padding:10px 6px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.82rem;font-weight:700;color:var(--text);min-height:76px}
.sw i{width:30px;height:30px;border-radius:50%;display:block}
.sw[aria-pressed="true"]{border-color:var(--text)}

/* sheet & toast */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .inner{background:var(--surface);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:700;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.flash{position:fixed;inset:0;background:var(--accent);opacity:0;pointer-events:none;z-index:65;transition:opacity .35s}
.flash.on{opacity:.35}
.note{background:color-mix(in srgb,var(--warn) 16%,var(--surface));border-radius:var(--r-md);padding:12px 14px;font-size:.92rem;margin:10px 0}
.note.bad{background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
details summary{cursor:pointer;font-weight:700;padding:10px 0;min-height:44px;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";color:var(--dim);font-weight:800;font-size:1.3rem;line-height:1}
details[open] summary::after{content:"−"}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;min-height:52px;border-bottom:1px solid var(--line)}
.toggle:last-child{border:0}
label.toggle{margin:0;font-size:1rem;color:var(--text);font-weight:500;cursor:pointer}
.toggle input{width:auto;min-height:0}
.toggle input[type=checkbox]{width:28px;height:28px;flex:none;accent-color:var(--accent)}
.pf-dots{display:flex;gap:8px}
.pf-dots button{width:44px;height:44px;font-size:1rem;border-radius:50%;border:2px solid var(--line);background:transparent;font-weight:800;color:var(--dim)}
.pf-dots button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* floating + (one place to log anything) */
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);z-index:45;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 calc(24px * var(--glowon)) var(--glow);transition:transform .08s}
.fab:active{transform:scale(.94)}
.fab svg{width:28px;height:28px}
.fab[hidden]{display:none}
.addgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
.addgrid .btn{min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:1rem}
.addgrid .btn small{font-weight:600;font-size:.8rem;opacity:.8}
.addgrid .btn.wide{grid-column:1/-1}
.qlog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.qlog button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:var(--r-md);min-height:72px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--display);font-weight:700;font-size:.9rem}
.qlog button:active{transform:scale(.96)}
.qlog button svg{width:26px;height:26px;color:var(--accent)}
.habits .hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;min-height:48px;border-top:1px solid var(--line)}
.habits .hrow:first-of-type{border-top:0}
.habits .hrow h3{margin:0;font-size:1rem}
.habits .walks{margin:0}
.chk .crow{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 2px;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:var(--text);font-size:1rem}
.chk .crow:first-of-type{border-top:0}
.chk .crow .tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:var(--on-accent)}
.chk .crow.done .tick{background:var(--accent);border-color:var(--accent)}
.chk .crow.done .lab{color:var(--dim);text-decoration:line-through}
details.sect{padding:4px 16px}
details.sect>summary{font-family:var(--display);font-size:1.05rem;padding:12px 0}
details.sect[open]>summary{border-bottom:1px solid var(--line);margin-bottom:6px}
.backlink{background:none;border:0;color:var(--accent);font-weight:700;font-size:1rem;min-height:44px;padding:0 4px;display:inline-flex;align-items:center;gap:4px}
:root[data-mode="light"] .backlink{color:var(--text)}
.card.tight{padding:14px 16px 12px}
.chips.col{flex-direction:column;align-items:flex-start;margin:0 0 6px}
.chk>summary{padding:8px 0}
.chk .crow{border-top:1px solid var(--line)}
body.ro [data-start],body.ro .qlog,body.ro .chk,body.ro .fab,body.ro #pfBtn,body.ro #copyCtx{display:none!important}
body.ro [data-walk],body.ro [data-prot]{pointer-events:none}
</style>
</head>

<main id="app"></main>

<canvas class="confetti" id="confetti"></canvas>
<script>
/* ============ Cloud sync config (anon/publishable key only: safe client-side, data is protected by RLS) ============ */
const SUPABASE_URL="https://rexnqtgodowbwjdvmudm.supabase.co";

function barChart(o){

function heatmap(weeks=12){

/* ============ Confetti ============ */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#confetti"),x=c.getContext("2d");c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);
  const acc=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"#C6FF3D";
  const cols=[acc,"#ffffff",acc,"#9AA3AF"];const ps=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*5+3,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));
  let t=0;const step=()=>{x.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++t<70)requestAnimationFrame(step);else x.clearRect(0,0,innerWidth,innerHeight)};step();
}

/* ============ Workout ============ */
let wRAF=null;
const curEx=()=>W.list[W.i];
function viewWorkout(){
  if(W.phase==="done")return viewFinish();
  const e=curEx(),ex=EX[e.key],timed=e.unit==="s"||e.unit==="a",rest=W.phase==="rest";
  const items=[];for(let r=1;r<=W.rounds;r++)W.list.forEach((x,i)=>items.push({r,i,x}));const pos=(W.r-1)*W.list.length+W.i;

    <div class="t" id="tT">${rest?fmtT((W.restEnd-Date.now())/1000):fmtT(W.el)}</div></div>
  ${W.phase==="ready"?`<button class="btn xl" id="wStart">Start</button>`:""}
  ${W.phase==="running"?`<button class="btn xl" id="wDone">Done</button>`:""}
  ${W.phase==="entry"?`<p class="extarget">${e.unit==="s"?"Seconds held. Adjust if needed.":"How many did you do?"}</p>
    <div class="stepper"><button id="mi" aria-label="Less">−</button><output id="repOut">${W.reps}</output><button id="pl" aria-label="More">+</button></div>
    <div class="seg">${["Easy","Good","Tough","Max"].map((l,i)=>`<button data-eff="${i+1}" aria-pressed="${W.eff===i+1}">${l}</button>`).join("")}</div>
    <button class="btn xl" id="wSave" style="margin-top:12px">Save set</button>`:""}
  ${rest?`<div class="row"><button class="btn alt grow" id="r15">+15 sec</button><button class="btn grow" id="rSkip">Skip rest</button></div>`:""}
  <details class="card"><summary>How to do it</summary><p>${esc(ex.cue)}</p></details>
  <div class="lbl" style="margin-top:12px">Up next</div><ul class="queue">${items.map((it,k)=>k<pos||k>pos+3?"":`<li class="${k===pos?"now":""}"><span>R${it.r} ${esc(EX[it.x.key].n)}</span><span>${unitTxt(it.x.target,it.x.unit)}</span></li>`).join("")}</ul>
  <div class="row" style="margin-top:14px"><button class="btn ghost grow" id="wSkip">Skip</button><button class="btn danger grow" id="wQuit">End session</button></div>`;
}
function wLoop(){
  cancelAnimationFrame(wRAF);
  const step=()=>{
    if(!W||W.phase==="done")return;
    const t=$("#tT"),ring=$("#tRing"),e=curEx();
    if(W.phase==="running"){
      W.el=(Date.now()-W.t0)/1000;
      if(t)t.textContent=fmtT(W.el);
      if(e.unit==="s"||e.unit==="a"){if(ring)ring.setAttribute("stroke-dashoffset",628.3*(1-clamp(W.el/e.target,0,1)));
        const left=e.target-W.el;if(left<=3.05&&left>0&&W.lastCount!==Math.ceil(left)){W.lastCount=Math.ceil(left);beep(1)}
        if(!W.beeped&&W.el>=e.target){W.beeped=true;beep(1,true);if(e.unit==="a"){finishSet();return}}}
    }else if(W.phase==="rest"){
      const left=(W.restEnd-Date.now())/1000;if(t)t.textContent=fmtT(left);if(ring)ring.setAttribute("stroke-dashoffset",628.3*(1-clamp(left/W.restLen,0,1)));
      if(left<=3.05&&left>0&&W.lastCount!==Math.ceil(left)){W.lastCount=Math.ceil(left);beep(1)}
      if(left<=0){beep(1,true);W.phase="ready";render();return}
    }
    wRAF=requestAnimationFrame(step);
  };wRAF=requestAnimationFrame(step);
}
function finishSet(){const e=curEx();W.phase="entry";W.reps=e.unit==="s"?Math.round(W.el):e.unit==="a"?0:e.target;W.eff=null;render()}
function bindWorkout(){
  on("wStart",()=>{unlockAudio();W.phase="running";W.t0=Date.now();W.el=0;W.beeped=false;W.lastCount=null;render()});
  on("wDone",()=>{W.el=(Date.now()-W.t0)/1000;finishSet()});
  on("mi",()=>{W.reps=Math.max(0,W.reps-1);$("#repOut").textContent=W.reps});
  on("pl",()=>{W.reps++;$("#repOut").textContent=W.reps});
  $$("[data-eff]").forEach(b=>b.onclick=()=>{W.eff=+b.dataset.eff;$$("[data-eff]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  on("wSave",()=>{const e=curEx();const prev=Math.max(bestFor(e.key),...W.sets.filter(x=>x.ex===e.key).map(x=>x.v),0);
    W.sets.push({ex:e.key,r:W.r,u:e.unit,tg:e.target,v:W.reps,sec:Math.round(W.el),eff:W.eff});
    if(prev>0&&W.reps>prev){W.prs.push(e.key);toast("New personal best: "+EX[e.key].n+" "+W.reps);confetti()}advance()});
  on("wSkip",advance);
  on("r15",()=>{W.restEnd+=15000;W.restLen+=15});
  on("rSkip",()=>{W.phase="ready";render()});
  on("wQuit",()=>{if(W.sets.length){W.phase="done";render()}else if(confirm("End without saving?")){W=null;wake(false);render()}});
  on("saveSession",saveSession);
  const rpe=$("#rpe");if(rpe)rpe.oninput=()=>$("#rpeV").textContent=rpe.value;
  $$("[data-sym]").forEach(b=>b.onclick=()=>$$("[data-sym]").forEach(x=>x.setAttribute("aria-pressed",x===b)));

// S.meals: [{id,d,meal:'b|l|d|s',name,g,kcal,p,c,f,fb,src}]
function ensureFood(){if(!S.meals)S.meals=[];if(!S.foodCache)S.foodCache={}}
function dayFood(d=iso()){ensureFood();return S.meals.filter(m=>m.d===d)}
function sum(arr,k){return arr.reduce((a,b)=>a+(b[k]||0),0)}
function dayTotals(d=iso()){const m=dayFood(d);return {kcal:Math.round(sum(m,"kcal")),p:Math.round(sum(m,"p")),c:Math.round(sum(m,"c")),f:Math.round(sum(m,"f")),fb:Math.round(sum(m,"fb")),n:m.length}}
function proteinTarget(){const p=P_();const w=trendNow()||p.startWeight||70;return Math.round(w*1.6)} // 1.6 g/kg during loss + resistance
function calorieTarget(){ // Mifflin-St Jeor, female, minus a safe deficit; floor protects breastfeeding
  const p=P_();const w=trendNow()||p.startWeight;const h=p.height,a=p.age;
  if(!w||!h||!a)return null;
  const bmr=10*w+6.25*h-5*a-161;
  const tdee=bmr*1.45; // light activity + postpartum
  let target=tdee-(p.breastfeeding?350:500); // gentler deficit if feeding
  const floor=p.breastfeeding?1800:1500;
  return Math.max(floor,Math.round(target/10)*10);
}
function scaleFood(f,g){const r=g/100;return {name:f.n,g,kcal:Math.round(f.k*r),p:+(f.p*r).toFixed(1),c:+(f.c*r).toFixed(1),f:+(f.f*r).toFixed(1),fb:+(f.fb*r).toFixed(1)}}
function searchFood(q){ensureFood();q=q.toLowerCase().trim();if(!q)return [];
  const cached=Object.values(S.foodCache).map(c=>({...c,_cache:true})).filter(f=>(f.n||"").toLowerCase().includes(q)).slice(0,6);
  const core=FOODDB.filter(f=>f.n.toLowerCase().includes(q)).slice(0,12); // curated NZ staples first
  const big=bigSearch(q,40);
  // de-dupe by lowercased name, curated+cached win
  const seen=new Set([...cached,...core].map(f=>f.n.toLowerCase()));
  const bigU=big.filter(f=>!seen.has(f.n.toLowerCase()));
  return [...cached,...core,...bigU].slice(0,60);
}

/* ============ Barcode (Open Food Facts, online; cached) ============ */
async function lookupBarcode(code){
  ensureFood();
  if(S.foodCache[code])return {...S.foodCache[code],_cache:true};
  if(!navigator.onLine)return {error:"offline"};
  try{
    const ac=new AbortController(),to=setTimeout(()=>ac.abort(),10000);
    const r=await fetch("https://world.openfoodfacts.org/api/v2/product/"+encodeURIComponent(code)+".json?fields=product_name,brands,nutriments,serving_quantity",{signal:ac.signal});clearTimeout(to);
    if(!r.ok)return {error:"neterr"};
    const j=await r.json();
    if(j.status!==1||!j.product)return {error:"notfound"};
    const n=j.product.nutriments||{};const nm=[j.product.brands,j.product.product_name].filter(Boolean).join(" ").trim()||("Product "+code);
    const nf=v=>{const x=+v;return Number.isFinite(x)&&x>=0?x:0};
    const food={n:nm,k:Math.round(nf(n["energy-kcal_100g"])||(n["energy_100g"]?nf(n["energy_100g"])/4.184:0)),p:nf(n.proteins_100g),c:nf(n.carbohydrates_100g),f:nf(n.fat_100g),fb:nf(n.fiber_100g),
      s:[["serving",nf(j.product.serving_quantity)||100],["100 g",100]],cat:"Barcode",code};
    S.foodCache[code]=food;commit();
    return food;
  }catch(e){return {error:"neterr"}}
}

function bindFood(){
  on("fPrev",()=>{FOODDATE=addDays(FOODDATE||iso(),-1);render()});

/* ============ Barcode scanner (native BarcodeDetector, else ZXing-WASM polyfill) ============ */
// iOS Safari has no native BarcodeDetector, so we lazy-load the Sec-ant/barcode-detector polyfill
// (ZXing-C++ WASM) from jsDelivr on first scan; the service worker caches it for offline use.
// Pinned to an exact version (a floating @2 could change under us; dynamic import() cannot carry an SRI hash). The module fetches its
// ZXing WASM engine from fastly.jsdelivr.net, so sw.js caches every *.jsdelivr.net host.
const ZXING_SRC="https://cdn.jsdelivr.net/npm/barcode-detector@2.3.1/dist/es/pure.min.js";
let BD=null,BDLOADING=null;
async function getDetector(){
  if(BD)return BD;
  if("BarcodeDetector" in window){BD=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]});return BD}
  if(!BDLOADING)BDLOADING=(async()=>{
    try{const m=await import(ZXING_SRC);const D=m.BarcodeDetector||m.default;BD=new D({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]});return BD}
    catch(e){return null}
  })();
  return BDLOADING;
}
async function scanBarcode(meal,d){
  sheet(`<h2 style="margin-top:0">Scan barcode</h2>
    <video id="bcVid" playsinline muted style="width:100%;border-radius:14px;background:#000;aspect-ratio:4/3;object-fit:cover"></video>
    <p class="dim" id="bcMsg">Starting camera…</p>
    <label>Or enter the barcode number</label><div class="row"><input id="bcNum" inputmode="numeric" placeholder="9400…" class="grow" style="width:auto"><button class="btn" id="bcGo">Look up</button></div>
    <button class="btn ghost block" id="bcClose" style="margin-top:12px">Cancel</button>`);
  let stream=null,stop=false,raf=null;
  const cleanup=()=>{stop=true;if(raf)cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop())};
  const finish=async code=>{cleanup();const m=$("#bcMsg");if(m)m.textContent="Looking up "+code+"…";
    const fd=await lookupBarcode(code);
    if(fd.error==="offline")return toast("Offline. Connect to scan, or add manually.");
    if(fd.error==="notfound")return toast("Not in the database. Add it manually.");
    if(fd.error)return toast("Lookup failed. Try again or add manually.");
    pickFood(fd,meal,d);
  };
  on("bcGo",()=>{const c=$("#bcNum").value.trim();if(c)finish(c)});
  sheetCleanup=cleanup;   // any way of closing this sheet switches the camera off
  on("bcClose",closeSheet);
  const det=await getDetector();
  const msg=$("#bcMsg");
  if(!det){if(msg)msg.textContent="Camera scanning isn't available here. Type the barcode number instead.";const v=$("#bcVid");if(v)v.style.display="none";return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    const v=$("#bcVid");if(!v){cleanup();return}v.srcObject=stream;await v.play();
    if(msg)msg.textContent="Point the camera at the barcode.";
    let misses=0;
    const tick=async()=>{if(stop)return;
      try{const codes=await det.detect(v);if(codes&&codes.length){finish(codes[0].rawValue);return}}catch(e){}
      if(++misses===80&&msg)msg.textContent="Hold steady, fill the frame with the barcode. Or type the number below.";
      raf=requestAnimationFrame(tick);
    };raf=requestAnimationFrame(tick);
  }catch(e){if(msg)msg.textContent="Camera unavailable (allow camera access, or type the number).";const v=$("#bcVid");if(v)v.style.display="none"}
}

/* ============ Big food database (USDA + AUSNUT), lazy-loaded & cached ============ */
// Shipped as foods.json.gz (built by build_fooddb.py). Loaded once, kept in memory + IndexedDB.
let BIGDB=null, BIGLOADING=null, BIGINDEX=null;
const bigStore={
  get(){return new Promise(res=>{try{const r=indexedDB.open("indy-fooddb",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>{const db=r.result;try{const q=db.transaction("kv").objectStore("kv").get("foods");q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}};r.onerror=()=>res(null)}catch(e){res(null)}})},
  set(v){return new Promise(res=>{try{const r=indexedDB.open("indy-fooddb",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>{const db=r.result;try{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").put(v,"foods");tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}};r.onerror=()=>res(false)}catch(e){res(false)}})}
};
function tokenize(s){return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(Boolean)}
function buildIndex(foods){
  const idx=new Map();
  foods.forEach((f,i)=>{const toks=new Set([...tokenize(f.n),...tokenize(f.syn||"")]);
    toks.forEach(t=>{if(!idx.has(t))idx.set(t,[]);idx.get(t).push(i)})});
  return idx;
}
// Bump FOODDB_VER whenever foods.json.gz is rebuilt (tools/build_fooddb.py prints it), or phones keep the old cached copy.
const FOODDB_VER="2026-10-05-11322";
async function gunzipText(buf){
  const u=new Uint8Array(buf);
  if(u[0]===0x1f&&u[1]===0x8b){   // still gzipped: inflate it
    if(!("DecompressionStream" in window))throw new Error("no DecompressionStream");
    return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  }
  return new TextDecoder().decode(u);   // the server already decoded it (Content-Encoding: gzip)
}
async function loadBigDB(onProgress){
  if(BIGDB)return BIGDB;
  if(BIGLOADING)return BIGLOADING;
  BIGLOADING=(async()=>{
    // 1. IndexedDB cache, only if it is the current version
    const rec=await bigStore.get();
    let data=rec&&rec.ver===FOODDB_VER&&rec.data&&rec.data.foods?rec.data:null;
    if(!data){
      onProgress&&onProgress("Downloading food database…");
      try{
        const r=await fetch("foods.json.gz");
        if(!r.ok)throw new Error("no file");
        data=JSON.parse(await gunzipText(await r.arrayBuffer()));
        if(!data.foods||!data.foods.length)throw new Error("empty");
        await bigStore.set({ver:FOODDB_VER,data});
      }catch(e){BIGLOADING=null;return null}
    }
    BIGDB=data;BIGINDEX=buildIndex(data.foods);
    return BIGDB;
  })();
  return BIGLOADING;
}
function ed1(a,b){ // true if within edit distance 1
  if(a===b)return true;const la=a.length,lb=b.length;if(Math.abs(la-lb)>1)return false;
  let i=0,j=0,diff=0;while(i<la&&j<lb){if(a[i]===b[j]){i++;j++}else{diff++;if(diff>1)return false;if(la>lb)i++;else if(lb>la)j++;else{i++;j++}}}
  return diff+(la-i)+(lb-j)<=1;
}
function bigSearch(q,limit=40){
  if(!BIGDB||!BIGINDEX)return [];
  const toks=tokenize(q);if(!toks.length)return [];
  const score=new Map();
  toks.forEach(t=>{
    // exact token
    (BIGINDEX.get(t)||[]).forEach(i=>score.set(i,(score.get(i)||0)+3));
    // prefix match (scan keys only when token >=3 chars)
    if(t.length>=3){for(const [k,arr] of BIGINDEX){if(k.startsWith(t)&&k!==t)arr.forEach(i=>score.set(i,(score.get(i)||0)+1))}}
  });
  // fuzzy fallback for typos: if nothing scored, try edit-distance-1 on index keys
  if(score.size===0&&toks.length){const t=toks[0];if(t.length>=4){for(const [k,arr] of BIGINDEX){if(k.length>=4&&Math.abs(k.length-t.length)<=1&&ed1(t,k))arr.forEach(i=>score.set(i,(score.get(i)||0)+1))}}}
  const foods=BIGDB.foods;
  const ranked=[...score.entries()].map(([i,s])=>{
    const f=foods[i];const nm=f.n.toLowerCase();
    let boost=0;if(nm.startsWith(toks[0]))boost+=2;if(f.src==="AUSNUT")boost+=1; // NZ-closest first
    boost+= Math.max(0,20-f.n.length/4)/10; // shorter names rank higher
    return [i,s+boost];
  }).sort((a,b)=>b[1]-a[1]).slice(0,limit);
  return ranked.map(([i])=>{const f=foods[i];return {n:f.n,k:f.k,p:f.p,c:f.c,f:f.f,fb:f.fib,sug:f.sug,na:f.na,src:f.src,s:[["100 g",100],["serving",150]],_big:true}});
}
function bigDBReady(){return !!BIGDB}
function bigDBCount(){return BIGDB?BIGDB.foods.length:0}

function haversine(a,b){const R=6371000,toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat),dLon=toR(b.lon-a.lon);
  const s=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}

let GPS=null;
function gpsSheet(){

function runGateSheet(){

function startGPS(type){
  if(GPS)return;   // never run two trackers (two watchers would count distance twice)
  if(type==="run"&&!runUnlocked()){toast("Running is locked until you have done the postpartum check.");return}
  if(!("geolocation" in navigator)){toast("This phone can't do GPS tracking. Log it manually instead.");return}
  GPS={type,t0:Date.now(),n:0,dist:0,elev:0,last:null,lastAlt:null,watch:null,paused:false,err:""};
  wake(true);
  sheet(gpsLiveHTML());
  bindGPSLive();
  GPS.watch=navigator.geolocation.watchPosition(onPos,onPosErr,{enableHighAccuracy:true,maximumAge:1000,timeout:10000});
  GPS.timer=setInterval(updGPS,1000);
}
function onPos(p){
  if(!GPS||GPS.paused)return;
  const c=p.coords,now={lat:c.latitude,lon:c.longitude,t:Date.now(),acc:c.accuracy,alt:c.altitude};
  if(c.accuracy&&c.accuracy>40)return; // ignore poor fixes
  if(GPS.last){const d=haversine(GPS.last,now);
    if(d>1&&d<60){ // plausible step
      GPS.dist+=d;
      if(now.alt!=null&&GPS.lastAlt!=null){const climb=now.alt-GPS.lastAlt;if(climb>0.8)GPS.elev+=climb}
      if(now.alt!=null)GPS.lastAlt=now.alt;
    }
  }else if(now.alt!=null)GPS.lastAlt=now.alt;
  GPS.last=now;GPS.n++;
}
function onPosErr(e){if(!GPS)return;GPS.err=e.code===1?"Allow location access in Settings → Safari to track. Or log manually.":"Getting GPS signal…";const m=$("#gMsg");if(m)m.textContent=GPS.err}
function gpsStats(){
  const el=(Date.now()-GPS.t0)/1000,km=GPS.dist/1000,kmh=el>5?km/(el/3600):0,pace=km>0.05?(el/60)/km:0;
  return {el,km,kmh,kcal:kcalFor(GPS.type,el/60,trendNow()||P_().startWeight,kmh),pace:pace?Math.floor(pace)+":"+String(Math.round((pace%1)*60)).padStart(2,"0"):"–",
    msg:GPS.err&&!GPS.n?GPS.err:GPS.n?"Tracking… keep the screen on.":"Getting GPS signal… step outside for a better fix."};
}
function gpsLiveHTML(){
  const s=gpsStats(),tn=(ACT_TYPES.find(t=>t[0]===GPS.type)||[,GPS.type])[1];
  const tile=(id,v,l)=>`<div class="tile"><b id="${id}" style="font-size:2rem">${v}</b><span>${l}</span></div>`;
  return `<h2 id="gTitle" style="margin-top:0">${tn}${GPS.paused?" (paused)":""}</h2>
    <div class="grid2" style="gap:10px">${tile("gpT",fmtT(s.el),"time")}${tile("gpK",r1(s.km),"km")}${tile("gpP",s.pace,"min/km pace")}${tile("gpC",s.kcal,"kcal")}${tile("gpS",r1(s.kmh),"km/h")}${tile("gpE","↑"+Math.round(GPS.elev),"elev gain m")}</div>
    <p class="dim" id="gMsg" style="font-size:.9rem;margin-top:10px">${s.msg}</p>
    <div class="grid2" style="margin-top:8px"><button class="btn alt xl" id="gPause">${GPS.paused?"Resume":"Pause"}</button><button class="btn xl" id="gFinish">Finish</button></div>
    <button class="btn ghost block" id="gDiscard" style="margin-top:8px">Discard</button>`;
}
// refresh the numbers in place: the buttons are never rebuilt, so a tap on Finish or Pause can't be lost mid-redraw
function updGPS(){
  if(!GPS)return;const s=gpsStats(),set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
  set("gpT",fmtT(s.el));set("gpK",r1(s.km));set("gpP",s.pace);set("gpC",s.kcal);set("gpS",r1(s.kmh));set("gpE","↑"+Math.round(GPS.elev));set("gMsg",s.msg);
  const tn=(ACT_TYPES.find(t=>t[0]===GPS.type)||[,GPS.type])[1];set("gTitle",tn+(GPS.paused?" (paused)":""));set("gPause",GPS.paused?"Resume":"Pause");
}
function bindGPSLive(){
  on("gPause",()=>{GPS.paused=!GPS.paused;updGPS()});
  on("gFinish",finishGPS);
  on("gDiscard",()=>{if(confirm("Discard this session?"))stopGPS()});
}
function stopGPS(){if(!GPS)return;if(GPS.watch!=null)navigator.geolocation.clearWatch(GPS.watch);clearInterval(GPS.timer);wake(false);GPS=null;closeSheet();render()}
function finishGPS(){
  const el=(Date.now()-GPS.t0)/1000,min=Math.round(el/60),km=r1(GPS.dist/1000);
  if(min<1){toast("Too short to save");stopGPS();return}
  const kmh=km/(el/3600),pace=km>0.05?(()=>{const p=(el/60)/km;return Math.floor(p)+":"+String(Math.round((p%1)*60)).padStart(2,"0")})():null;
  const kcal=kcalFor(GPS.type,min,trendNow()||P_().startWeight,kmh);
  S.activity.push({id:uid(),d:iso(),kind:GPS.type,min,km:km||null,kcal,elev:Math.round(GPS.elev)||null,pace,src:"GPS"});
  commit();toast(`Saved: ${km} km, ${min} min, ${kcal} kcal`);stopGPS();if(km>=2)confetti();
}

function bindHealth(inSheet){

function importView(){return `<section class="card"><h3>Apple Health & Apple Watch</h3>${healthBody()}</section>

// Sleep from Apple Health can arrive as hours, minutes or seconds depending on the Shortcut: under 24 = hours, 24-1440 = minutes, above that = seconds.
function sleepHours(v){if(!(v>0))return null;const hrs=v<24?v:v<=1440?v/60:v<=86400?v/3600:null;return hrs!=null&&hrs>0&&hrs<24?r1(hrs):null}
// Tidy whatever was pasted: a whole link (https://…#weight=…) or URL-encoded text (weight%3D71.8%0A…) both work.
function cleanHealthText(raw){let t=String(raw==null?"":raw).trim();
  const hi=t.lastIndexOf("#");if(hi>=0&&t.slice(hi).includes("="))t=t.slice(hi+1);

// Import pasted/clipboard text; returns the number of items imported (0 = nothing recognised).
function importHealthText(raw){const n=applyKV(parseKV(cleanHealthText(raw)));if(n){commit();toast("Imported "+n+" item"+(n>1?"s":""));render()}return n}
function parseKV(text){const o={};text.split(/[\n&;]+/).forEach(l=>{const m=l.match(/^\s*([a-z %]+?)\s*[:=]\s*([-\d.,]+)/i);if(m){const v=num(m[2]);if(v!=null)o[m[1].trim().toLowerCase()]=v}});return o}
function applyKV(o,date=iso()){
  let n=0;const w=o.weight??o.kg;

function importWithings(text){

async function saveFile(name,data,type){

  try{const f=new File([blob],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true}}catch(e){if(e&&e.name==="AbortError")return false}

}

function periodStats(days){
  const start=addDays(iso(),-days),ms=s=>parseD(s).getTime();
  const ws=sorted(S.weights.filter(w=>w.d>=start));
  const tsAll=trendSeries().filter(x=>x.t!=null);
  const tAt=d=>{const a=tsAll.filter(x=>x.d<=d);return a.length?a[a.length-1].t:null};
  const tStart=tAt(start)??(tsAll.length?tsAll[0].t:null),tNow=tAt(iso());
  const meas=sorted(S.measures.filter(m=>m.waist&&m.d>=start));
  const hb=sorted(S.hba1c.filter(h=>h.d>=start));
  const sess=S.sessions.filter(x=>x.d>=start);
  const mins=(()=>{let t=0;for(let i=0;i<days;i++)t+=dayMinutes(addDays(iso(),-i));return Math.round(t)})();
  const walks=S.activity.filter(a=>a.kind==="postmeal"&&a.d>=start).length;
  const fast=S.glucose.filter(g=>g.ctx==="fasting"&&g.d>=start).map(g=>g.mmol);
  return {start,tStart,tNow,dW:tStart!=null&&tNow!=null?r1(tNow-tStart):null,meas,hb,sess:sess.length,mins,walks,fastAvg:fast.length?r1(mean(fast)):null};
}

// Merge two states without losing either side. Records union by id minus tombstones; pf/protein union (max); newer profile wins.
function mergeStates(a,b){
  const m=blank(),cutoff=Date.now()-400*864e5,del={};
  [a.deleted,b.deleted].forEach(d=>Object.entries(d||{}).forEach(([id,ts])=>{if(ts>cutoff&&!(del[id]>=ts))del[id]=ts}));
  m.deleted=del;
  ARR_KEYS.forEach(k=>{
    const out=new Map();
    [...(a[k]||[]),...(b[k]||[])].forEach(x=>{if(x&&x.id&&!del[x.id]&&!out.has(x.id))out.set(x.id,x)});
    const c=(p,q)=>p<q?-1:p>q?1:0;
    m[k]=[...out.values()].sort((x,y)=>c(x.d||"",y.d||"")||c(x.t||"",y.t||"")||c(x.id,y.id));
  });
  [a.pf,b.pf].forEach(p=>Object.keys(p||{}).forEach(d=>{if(p[d])m.pf[d]=true}));
  [b.foodCache,a.foodCache].forEach(c=>Object.keys(c||{}).forEach(code=>{m.foodCache[code]=c[code]}));   // barcode lookups: union by key, local wins
  [a.protein,b.protein].forEach(p=>Object.keys(p||{}).forEach(d=>{m.protein[d]=Math.max(m.protein[d]||0,p[d]||0)}));
  const st=s=>(s.profile&&s.profile.updatedAt)||s.profileCleared||0,pa=st(a),pb=st(b);
  m.profile=pb>pa?b.profile:pa>pb?a.profile:(a.profile||b.profile);
  m.profile=m.profile||null;
  m.profileCleared=Math.max(a.profileCleared||0,b.profileCleared||0);
  m.lastBackup=[a.lastBackup,b.lastBackup].filter(Boolean).sort().pop()||null;
  m.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  return m;
}
const normState=x=>canon(mergeStates(x,x));

function sbLoad(){return new Promise((res,rej)=>{if(window.supabase)return res();const s=document.createElement("script");s.src=SB_SRC;s.integrity=SB_SRI;s.crossOrigin="anonymous";s.onload=res;s.onerror=()=>{s.remove();rej(new Error("Can't reach the cloud right now"))};document.head.appendChild(s)})}
let sbMaking=null;
async function sbClient(){
  if(sb)return sb;
  if(!SUPABASE_URL||!SUPABASE_KEY)throw new Error("Cloud sync isn't set up in this build");
  if(!sbMaking)sbMaking=sbMake().finally(()=>{sbMaking=null});
  return sbMaking;
}
async function sbMake(){
  await sbLoad();
  if(sb)return sb;
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:"indy-sb-auth"}});
  sb.auth.onAuthStateChange((ev,sess)=>{setTimeout(()=>{if(ev==="SIGNED_OUT")signedOutLocal();else if(sess&&sess.user)SYNC.user=sess.user},0)});
  return sb;
}
async function initSync(){
  if(!SYNC.known||SYNC.initing){SYNC.booting=false;return}
  SYNC.initing=true;
  try{
    const c=await sbClient(),{data,error}=await c.auth.getSession();
    if(data&&data.session){SYNC.user=data.session.user;SYNC.email=data.session.user.email||SYNC.email;SYNC.initing=false;await syncNow()}
    else if(!error){SYNC.known=false;saveMeta()}   // session really gone; a network error keeps us "known" and retries on 'online'
  }catch(e){SYNC.err=errMsg(e)}
  finally{SYNC.initing=false;if(SYNC.booting){SYNC.booting=false;render()}else renderSyncCard()}
}
function scheduleSync(){if(RO||!(SYNC.user||SYNC.known))return;clearTimeout(SYNC.t);SYNC.t=setTimeout(()=>{SYNC.user?syncNow():initSync()},2000)}
function kickSync(){if(SYNC.user)syncNow();else if(SYNC.known)initSync()}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")kickSync()});
addEventListener("online",kickSync);

async function syncNow(){
  if(!SYNC.user)return;
  if(SYNC.busy){SYNC.again=true;return}
  if(!navigator.onLine){SYNC.err="Offline. It will sync when you're back online.";uiSync();return}
  SYNC.busy=true;SYNC.err="";uiSync();
  try{
    const c=await sbClient(),me=SYNC.user.id;let ok=false;
    for(let n=0;n<4&&!ok;n++){
      const {data:mine,error:e1}=await c.from("app_state").select("state,updated_at").eq("user_id",me).maybeSingle();
      if(e1)throw e1;
      if(!mine&&(RO||(!S.profile&&!hasData()))){    // no data of our own: is someone sharing theirs?
        const {data:sh,error:e2}=await c.from("app_state").select("state").neq("user_id",me).order("updated_at",{ascending:false}).limit(1);
        if(e2)throw e2;
        if(sh&&sh.length)enterViewer(migrate(sh[0].state));else if(RO){await leaveViewer();render()}
        ok=true;break;
      }
      if(RO){await leaveViewer();if(!typing()&&!W)render()}
      let changed=false,remote=null;
      if(mine){
        remote=migrate(mine.state);
        const merged=mergeStates(S,remote);
        changed=normState(S)!==canon(merged);
        if(changed){S=merged;persistNow();applyTheme()}
      }
      if(!(remote&&normState(remote)===normState(S))){   // push only when the cloud copy differs
        const body=JSON.parse(JSON.stringify(S));
        if(mine){
          const {data:u,error:e3}=await c.from("app_state").update({state:body,updated_at:new Date().toISOString()}).eq("user_id",me).eq("updated_at",mine.updated_at).select("user_id");
          if(e3)throw e3;
          if(!u||!u.length){if(changed&&!typing()&&!W)render();continue}   // someone else wrote first: merge again
        }else{
          const {error:e4}=await c.from("app_state").insert({user_id:me,state:body});
          if(e4){if(e4.code==="23505")continue;throw e4}
        }
      }
      if(changed&&!typing()&&!W)render();
      ok=true;
    }
    if(!ok)throw new Error("Cloud was busy. Will retry shortly.");
    SYNC.last=Date.now();saveMeta();
  }catch(e){SYNC.err=errMsg(e)}
  finally{SYNC.busy=false;uiSync();if(SYNC.again){SYNC.again=false;setTimeout(syncNow,300)}}
}
function enterViewer(st){RO=true;S=st;document.body.classList.add("ro");applyTheme();if(!typing()&&!W)render()}
async function leaveViewer(){RO=false;document.body.classList.remove("ro");S=blank();await loadState();applyTheme()}
function signedOutLocal(){
  if(!SYNC.user&&!SYNC.known)return;
  SYNC.user=null;SYNC.known=false;SYNC.msg="";SYNC.err="";SYNC.viewers=null;saveMeta();
  if(RO)leaveViewer().then(render);else{renderSyncCard();renderShareCard()}
}
async function signOut(){try{if(sb)await sb.auth.signOut()}catch(e){}signedOutLocal()}

function syncStatusText(){
  if(SYNC.busy)return "Syncing…";
  if(SYNC.err)return SYNC.err;
  return SYNC.last?"Last synced "+new Date(SYNC.last).toLocaleString("en-NZ",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}):"Not synced yet";
}
function uiSync(){const s=$("#syncStatus");if(s)s.textContent=syncStatusText();const b=$("#sbSync");if(b)b.disabled=SYNC.busy}
const setMsg=t=>{SYNC.msg=t||"";const m=$("#sbMsg");if(m)m.textContent=SYNC.msg};
function renderSyncCard(){
  const el=$("#syncCard");if(!el)return;
  const signed=!!(SYNC.user||SYNC.known);let h;
  const msg=`<p id="sbMsg" role="alert" style="color:var(--bad);font-size:.86rem;margin:8px 0 0;overflow-wrap:anywhere">${esc(SYNC.msg)}</p>`;
  if(!SUPABASE_URL)h=`<h3>Cloud sync</h3><p class="dim" style="font-size:.88rem">Not set up in this build.</p>`;
  else if(signed)h=`<h3>Cloud sync</h3><p style="overflow-wrap:anywhere;margin:6px 0 0"><b>${esc(SYNC.email)}</b></p><p class="dim" style="font-size:.86rem;margin:2px 0 10px" id="syncStatus">${esc(syncStatusText())}</p>
    ${RO?"":`<button class="btn block" id="sbSync" ${SYNC.busy?"disabled":""}>Sync now</button>`}
    <details style="margin-top:12px"><summary>Change password</summary>
      <label for="sbNewPw">New password (min 8 characters)</label><input id="sbNewPw" type="password" autocomplete="new-password" minlength="8">
      <button class="btn alt block" id="sbPw" style="margin-top:8px">Update password</button></details>
    ${msg}<button class="btn alt block" id="sbOut" style="margin-top:10px">Sign out</button>`;
  else h=`<h3>Cloud sync</h3><p class="dim" style="font-size:.88rem">Back up your data and keep your devices in step. Create an account once, then sign in on each device. Everything still works offline.</p>
    <form id="sbForm" novalidate><label for="sbEmail">Email</label><input id="sbEmail" type="email" inputmode="email" autocomplete="username" value="${esc(SYNC.email)}">
    <label for="sbPass">Password (min 8 characters)</label><input id="sbPass" type="password" autocomplete="current-password" minlength="8">
    ${msg}<div class="grid2" style="margin-top:10px"><button class="btn" id="sbIn" type="submit">Sign in</button><button class="btn alt" id="sbUp" type="button">Create account</button></div></form>`;
  el.innerHTML=h;
  on("sbSync",()=>{syncNow();loadViewers()});
  on("sbOut",signOut);
  const f=$("#sbForm");
  if(f){
    f.onsubmit=e=>{e.preventDefault();authGo("in")};
    on("sbUp",()=>authGo("up"));
  }
  on("sbPw",async()=>{
    const pw=$("#sbNewPw").value;if(pw.length<8)return setMsg("Password must be at least 8 characters.");
    const b=$("#sbPw");b.disabled=true;setMsg("");
    try{const c=await sbClient();const {error}=await c.auth.updateUser({password:pw});if(error)throw error;toast("Password updated");renderSyncCard()}
    catch(e){setMsg(errMsg(e));b.disabled=false}});
}
async function authGo(mode){
  const email=($("#sbEmail").value||"").trim().toLowerCase(),password=$("#sbPass").value||"";
  SYNC.email=email;
  if(!/^\S+@\S+\.\S+$/.test(email))return setMsg("Enter a valid email address.");
  if(password.length<8)return setMsg("Password must be at least 8 characters.");
  const bs=[$("#sbIn"),$("#sbUp")];bs.forEach(b=>b.disabled=true);setMsg("");
  try{
    const c=await sbClient();
    const {data,error}=mode==="up"?await c.auth.signUp({email,password}):await c.auth.signInWithPassword({email,password});
    if(error)throw error;
    if(!data.session)throw new Error("No session was returned. Try Sign in.");
    SYNC.user=data.session.user;SYNC.known=true;SYNC.email=data.session.user.email||email;SYNC.err="";SYNC.msg="";saveMeta();
    renderSyncCard();toast(mode==="up"?"Account created":"Signed in");
    loadViewers();await syncNow();renderSyncCard();
  }catch(e){setMsg(errMsg(e));bs.forEach(b=>{if(b)b.disabled=false})}
}

// Share progress: the owner lists emails that may read her state (read-only, enforced by RLS)
async function loadViewers(){
  if(!SYNC.user||RO)return;
  try{const c=await sbClient();const {data,error}=await c.from("viewers").select("viewer_email").eq("owner_id",SYNC.user.id).order("viewer_email");if(error)throw error;SYNC.viewers=data.map(x=>x.viewer_email);SYNC.verr=""}
  catch(e){SYNC.verr=errMsg(e)}
  renderShareCard();
}
function renderShareCard(){
  const el=$("#shareCard");if(!el)return;
  if(!SUPABASE_URL||!(SYNC.user||SYNC.known)){el.innerHTML=`<h3>Share progress</h3><p class="dim" style="font-size:.88rem">Sign in to Cloud sync first, then you can let someone follow your progress (read-only).</p>`;return}
  const list=SYNC.viewers;
  el.innerHTML=`<h3>Share progress</h3><p class="dim" style="font-size:.88rem">People you add can see your Home and Insights, read-only, when they sign in with that email. They can't change anything.</p>
    ${SYNC.verr?`<p class="dim" style="font-size:.84rem">${esc(SYNC.verr)}</p>`:""}
    <ul class="list">${(list||[]).map(v=>`<li><span class="grow" style="overflow-wrap:anywhere">${esc(v)}</span><button class="x" data-unshare="${esc(v)}" aria-label="Stop sharing with ${esc(v)}">×</button></li>`).join("")||`<li class="dim">${list?"Not shared with anyone":SYNC.verr?"Can't load the list right now":"Loading…"}</li>`}</ul>
    <label for="shEmail">Add a viewer's email</label><input id="shEmail" type="email" inputmode="email" autocomplete="off"><button class="btn xl" id="shAdd" style="margin-top:10px">Share</button>`;
  on("shAdd",async()=>{
    const email=($("#shEmail").value||"").trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email))return toast("Enter a valid email");
    try{const c=await sbClient();const {error}=await c.from("viewers").insert({owner_id:SYNC.user.id,viewer_email:email});if(error&&error.code!=="23505")throw error;toast("Shared with "+email);syncNow();loadViewers()}
    catch(e){toast(errMsg(e))}});
  $$("[data-unshare]").forEach(b=>b.onclick=async()=>{
    try{const c=await sbClient();const {error}=await c.from("viewers").delete().eq("owner_id",SYNC.user.id).eq("viewer_email",b.dataset.unshare);if(error)throw error;toast("Stopped sharing");loadViewers()}
    catch(e){toast(errMsg(e))}});
}
// read-only viewer mode
function roBanner(){const n=S.profile&&S.profile.name;return `<section class="insight good"><b>${n?"Viewing "+esc(n)+"'s progress":"Viewing shared progress"}</b><div class="dim" style="font-size:.84rem">Read-only. It refreshes each time you open the app.</div></section>`}
function viewYouRO(){return `<div class="top"><h1>You</h1></div><section class="card" id="syncCard"></section>`}
function bindYouRO(){renderSyncCard()}

/* ============ Boot ============ */
$("#fab").onclick=openAddSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#sheet").classList.contains("on")&&!walkTimer&&!GPS)closeSheet()});   // desktop/keyboard nicety
(async()=>{
  await loadState();applyTheme();render();
  initSync();setTimeout(()=>{if(SYNC.booting){SYNC.booting=false;render()}},6000);
  try{if(navigator.storage&&navigator.storage.persisted)persisted=await navigator.storage.persisted()}catch(e){}
  try{if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js")}catch(e){}
  try{const h=(location.hash||"").slice(1);if(h&&S.profile){const n=applyKV(parseKV(decodeURIComponent(h)));if(n){commit();toast("Imported from Apple Health");history.replaceState(null,"",location.pathname);render()}}}catch(e){}
})();
</script>
